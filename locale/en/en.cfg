[mod-setting-name]
world-mirror-x=X-axis Mirror
world-mirror-y=Y-axis Mirror
world-mirror-x-line=East/west mirror line
world-mirror-y-line=North/south mirror line

[mod-setting-description]
world-mirror-x=Make the east and west halves of the map mirror images.
world-mirror-y=Make the north and south halves of the map mirror images.
world-mirror-x-line=Where the east/west mirror line sits, in chunks from the origin. Everything east of it is copied westward.
world-mirror-y-line=Where the north/south mirror line sits, in chunks from the origin. Everything south of it is copied northward.
